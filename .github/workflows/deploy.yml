name: Deploy pe VM

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite pornire manuală din tab-ul Actions

concurrency:
  group: deploy-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend (sub-cale + URL-uri same-origin)
        working-directory: app
        env:
          VITE_BASE: /unde-locuiesc-romanii/
          VITE_DATA_URL: ${{ vars.VITE_DATA_URL }}
          VITE_ROUTING_URL: ${{ vars.VITE_ROUTING_URL }}
        run: |
          npm ci
          npm run build

      - name: Pregătește cheia SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH_HOST="$(echo '${{ secrets.SSH_HOST }}' | xargs)"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sincronizează codul + dist pe VM (fără data/ și node_modules)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_HOST="$(echo "$SSH_HOST" | xargs)"
          SSH_USER="$(echo "$SSH_USER" | xargs)"
          DEPLOY_PATH="$(echo "$DEPLOY_PATH" | xargs)"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'data' \
            --exclude 'node_modules' \
            --exclude 'app/node_modules' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Reconstruiește și repornește serviciile
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_HOST="$(echo "$SSH_HOST" | xargs)"
          SSH_USER="$(echo "$SSH_USER" | xargs)"
          DEPLOY_PATH="$(echo "$DEPLOY_PATH" | xargs)"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml up -d --build"
