services:
  # Pipeline ETL — rulat la cerere:
  #   docker compose run --rm pipeline python -m ulr_pipeline.run all
  pipeline:
    build: ./pipeline
    profiles: ["pipeline"]
    volumes:
      - ./data:/data
      - ./pipeline/src:/app/src
    environment:
      ULR_DATA_IN: /data
      ULR_DATA_OUT: /data/out
      ULR_STAGING: /data/staging

  # Refresher avertizări meteo — preia periodic feed-ul nowcasting MeteoRomania și
  # publică populația afectată pe cod de severitate în data/out/live/.
  #   docker compose run --rm warnings python -m ulr_pipeline.warnings_live once
  warnings:
    build: ./pipeline
    volumes:
      - ./data:/data
      - ./pipeline/src:/app/src
    environment:
      ULR_DATA_IN: /data
      ULR_DATA_OUT: /data/out
      ULR_STAGING: /data/staging
      WARN_NOWCAST_URL: https://www.meteoromania.ro/avertizari-nowcasting-xml-gis.php
      WARN_GENERAL_URL: https://www.meteoromania.ro/avertizari-xml.php
      WARN_INTERVAL: "600"
    command: python -m ulr_pipeline.warnings_live serve
    restart: unless-stopped

  # Refresher prognoze: ECMWF IFS (meteo) + CAMS (calitatea aerului).
  # CAMS este omis în siguranță când ADS_API_KEY nu este configurat.
  #   docker compose run --rm forecast python -m ulr_pipeline.forecast_live once
  forecast:
    build: ./pipeline
    volumes:
      - ./data:/data
      - ./pipeline/src:/app/src
    environment:
      ULR_DATA_IN: /data
      ULR_DATA_OUT: /data/out
      ULR_STAGING: /data/staging
      FORECAST_INTERVAL: "${FORECAST_INTERVAL:-21600}"
      ADS_API_URL: "${ADS_API_URL:-https://ads.atmosphere.copernicus.eu/api}"
      ADS_API_KEY: "${ADS_API_KEY:-}"
    command: python -m ulr_pipeline.forecast_live serve
    restart: unless-stopped

  # Cron: descarcă zilnic (10:00, ora României) grilele climatice actualizate de la
  # opendata.meteoromania.ro și re-asamblează produsele. Anul din URL se ia automat.
  #   descărcare manuală:  docker compose run --rm climate-cron \
  #                          bash -c '. /app/cron.env 2>/dev/null; python -m ulr_pipeline.climate_refresh once'
  climate-cron:
    build: ./pipeline
    entrypoint: ["/app/cron_entry.sh"]
    volumes:
      - ./data:/data
      - ./pipeline/src:/app/src
    environment:
      ULR_DATA_IN: /data
      ULR_DATA_OUT: /data/out
      ULR_STAGING: /data/staging
      TZ: Europe/Bucharest
      CRON_HOUR: "10"
      CRON_MIN: "0"
      RUN_ON_START: "0"   # pune "1" ca să actualizeze imediat la pornire
    restart: unless-stopped

  # Serverul de date — simulează object storage-ul (CORS + range requests)
  data:
    image: caddy:2-alpine
    ports:
      - "8090:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/out:/srv:ro

  # Aplicația web — Vite dev server
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
    environment:
      VITE_DATA_URL: http://localhost:8090
      VITE_ROUTING_URL: http://localhost:8091
    depends_on:
      - data

  # --- Rutare (opțional): PostGIS + pgRouting cu graful rutier OSM România ---
  # Prima punere în funcțiune:  docker compose up -d routing-db
  #                             docker compose run --rm routing-import
  #                             docker compose up -d routing-api
  routing-db:
    image: pgrouting/pgrouting:latest
    environment:
      POSTGRES_USER: ulr
      POSTGRES_PASSWORD: ulrpass
      POSTGRES_DB: routing
    volumes:
      - routing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulr -d routing"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # importul grafului (o singură dată; pbf-ul se cache-uiește în data/osm/)
  routing-import:
    build: ./infra/routing/import
    profiles: ["routing-import"]
    depends_on:
      routing-db:
        condition: service_healthy
    environment:
      PGHOST: routing-db
      PGUSER: ulr
      PGPASSWORD: ulrpass
      PGDATABASE: routing
    volumes:
      - ./data:/data
      - ./data/out:/out:ro

  routing-api:
    build: ./infra/routing/api
    ports:
      - "8091:8000"
    depends_on:
      routing-db:
        condition: service_healthy
    environment:
      PGHOST: routing-db
      PGUSER: ulr
      PGPASSWORD: ulrpass
      PGDATABASE: routing
    restart: unless-stopped

volumes:
  node_modules:
  routing_pgdata:
